apiVersion: apps/v1
kind: Deployment
metadata:
  name: mygame
  labels:
    app: my-game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-game
  template:
    metadata:
      labels:
        app: my-game
    spec:
      containers:
        - name: my-game
          image: lokiii2001/tic-tac-toe:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

---            

apiVersion: v1
kind: Service
metadata:
  name: my-game-service
  labels:
    app: my-game   
spec:
  type: NodePort 
  selector:
    app: my-game
  ports:
    -port: 80
      targetPort: 80
      nodePort: 30080
